# JADIJCB Supabase Project Configuration
project_id = "jadijcb-morocco"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://jadijcb.ma", "https://*.run.app"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "رمز التحقق لمنصة جادي جي سي بي JADIJCB هو: {{ .Code }}"
