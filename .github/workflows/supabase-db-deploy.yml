name: Automated Supabase DB Migration CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-db-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-database:
    name: Apply SQL Migrations to Supabase Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase Cloud Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Migration Files Syntax
        run: |
          echo "Verifying local SQL migration files..."
          ls -la supabase/migrations/

      - name: Push Database Migrations to Remote Supabase
        run: |
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Report Deployment Status
        run: |
          echo "Successfully applied database migrations to JADIJCB Production Cloud DB."
